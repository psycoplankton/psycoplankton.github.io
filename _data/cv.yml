    Experience:
    - company: Supervised Program for Alignment Research (SPAR)
      position: Research Fellow
      location: Remote
      start_date: '2026-03-01'
      end_date: '2026-05-01'
      summary: Causal Intervention, Representation Geometry Analysis, Latent Space
        Dynamics, Activation and Attribution Patching.
      highlights:
      - Generated a 14.7K-triple synthetic corpus and 543 graded scenarios spanning
        1 day–500 years using Qwen3-32B on vLLM with closed-vocabulary anchors, banned-word
        constraints, and ±2-token length matching.
      - Trained layer-wise linear probes on residual streams of 7 LLMs (1.7B–14B across
        three model families) via TransformerLens, reaching 99% accuracy; validated
        with shuffle, random-direction, and low-rank controls.
      - Established log-linear (Weber–Fechner) horizon encoding by fitting five functional
        forms via AIC/BIC with bootstrap CIs; log-linear won 97.4% of fits ($R^2=0.934$).
      - Quantified manifold geometry via PCA with cubic-spline tortuosity, persistent
        homology (Vietoris–Rips, Wasserstein/bottleneck, Betti numbers), and TwoNN
        intrinsic dimension; corrected a 192× activation-norm confound.
      - Ran full and direction-restricted activation patching with per-head circuit
        attribution, exposing an encode $\neq$ use dissociation; benchmarked linear
        against manifold-spline steering using Bhattacharyya energy.
    - company: IBM Research
      position: Research Intern
      location: Bangalore, India
      start_date: '2025-05-01'
      end_date: '2025-08-01'
      summary: Static Code Analysis, Synthetic Data Creation, Repository-Level Code
        Comprehension, Chain-of-Thought Prompting.
      highlights:
      - Conducted comprehensive literature review of code chunking, Retrieval-Augmented
        Code Generation, multimodal embedding models, and contrastive learning techniques.
      - Manually engineered a benchmark dataset for repository-level code comprehension
        (25 multi-file, 25 single-file problems) and evaluated SOTA code embedding
        models with repository callgraph integration.
      - Designed a threefold Agentic pipeline with LLM-as-a-judge evaluation setup
        for generating novel query-file(s) tuples targeting repository-level understanding.
    - company: Speech and Language Lab, NTU Singapore
      position: Research Intern
      location: Singapore (Hybrid)
      start_date: '2024-10-01'
      end_date: Present
      summary: LLM Fine-tuning, PEFT, LoRA, LLaMA Adapters, Emotion Extraction, Prompt
        Tuning.
      highlights:
      - Researched and implemented parameter-efficient fine-tuning strategies (PEFT,
        LoRA, Adapters, Prompt Tuning) on Lightning.Ai's litgpt to enhance emotion
        extraction and depression detection in low-resource screening interviews.
      - Experimented with data augmentation, attention-based models, and adversarial
        perturbation, integrating robust loss functions (focal loss) to boost generalization.
      - Achieved 69% F1 score on the DAIC-WOZ dataset, surpassing state-of-the-art
        embedding models.
      - Fine-tuned Qwen3-8B and Qwen3.5-9B on COKE dataset with LoRA; evaluated generation
        quality via BLEU, METEOR, and ROUGE metrics for open-ended clinical dialogues.
    - company: Visual Computing and Analytics Lab, IIT BHU
      position: Research Intern
      location: Varanasi, India
      start_date: '2023-08-01'
      end_date: '2024-04-01'
      summary: GraphMamba, GANs, Graph Neural Networks, Fuzzy Logic Systems, DeepWalk,
        Node2Vec, Struc2Vec.
      highlights:
      - Redesigned GraphGAN with Wasserstein Loss, elevating link-prediction accuracy
        from 84.7% to 88.57%.
      - Implemented DeepWalk, Node2Vec, and Struc2Vec to extract and evaluate pre-trained
        node embedding vectors.
      - Pioneered a Fuzzy Pre-Processing layer with modified K-Means Clustering to
        extract semantic features from node embeddings, boosting downstream link prediction
        with GraphMamba by up to 5%.
    Projects:
    - name: IOI Circuit Detection - Interpretability in the Wild
      summary: Mechanistic Interpretability, activation patching, circuit discovery,
        logit lens analysis, causal ablations.
      highlights:
      - Reproduced end-to-end mechanistic analysis of Indirect Object Identification
        (IOI) in GPT-2 Small, identifying and isolating circuits at attention-head
        granularity.
      - Implemented IOI dataset generation, activation patching, and template-conditioned
        mean ablations to causally trace information flow across residual streams.
      - Identified and categorized functional head classes (Name Movers, S-Inhibition,
        Induction, Duplicate Token heads) and verified faithfulness and minimality
        via knockouts.
    - name: Understanding Modern LLM Architectures & Alignment
      summary: Mixture-of-Experts, sliding window attention, rolling buffer KV Cache,
        RLHF, Curriculum Learning.
      highlights:
      - 'Engineered core transformer building blocks from scratch: RMSNorm, RoPE,
        SwiGLU activations, rolling buffer KV caching, sliding window attention, and
        Mixture-of-Experts (MoE) layers.'
      - Built end-to-end pipelines for Supervised Fine-Tuning (SFT) and reward modeling
        using pairwise preference datasets with Bradley-Terry objectives.
      - Implemented RLHF via PPO and Group Relative Policy Optimization (GRPO) with
        reward normalization, KL regularization, and group advantage estimation.
    - name: PaliGemma Reimplementation from Scratch
      url: https://github.com/psycoplankton/PaliGemma-Reimplementation
      summary: Multi/Grouped Query Attention, KV Cache, MultiModal LMs, Vision Transformers,
        CLIP, RoPE.
      highlights:
      - Reimplemented google/siglip-so400m-patch14-384 and google/gemma-2b architectures
        from scratch in PyTorch.
      - Engineered a Multimodal Language Model with linear projection layers aligning
        image and text representations for cross-modal tasks.
      - Implemented KV caching and top-p sampling from scratch with pre-trained HuggingFace
        weights.
